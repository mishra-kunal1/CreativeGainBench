[project]
name = "creativegainbench"
version = "0.1.0"
description = "Benchmark for evaluating creativity gain in agent-generated outputs"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "openai",
    "python-dotenv",
]

[project.scripts]
download-datasets = "creativegainbench.utils.download_dataset:main"
create-subset = "creativegainbench.utils.create_subset:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
