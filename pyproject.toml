[project]
name = "creativegainbench"
version = "0.1.0"
description = "Benchmark for evaluating creativity gain in agent-generated outputs"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "openai",
    "python-dotenv",
    "torch",
    "sentence-transformers",
    "numpy",
    "scipy",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
download-datasets = "creativegainbench.utils.download_dataset:main"
create-subset = "creativegainbench.utils.create_subset:main"
build-eval-prompts = "creativegainbench.utils.build_eval_prompts:main"
prepare-artifacts = "creativegainbench.artifacts.prepare:main"
calibrate-delta-d = "creativegainbench.artifacts.calibrate_delta_d:main"
run-benchmark = "creativegainbench.eval.benchmark_eval:main"
run-mas = "creativegainbench.eval.mas_infer:main"
run-mas-agents = "creativegainbench.eval.mas_agents:main"
run-mas-score = "creativegainbench.eval.mas_score:main"
run-mas-ablation = "creativegainbench.eval.mas_ablation:main"
run-trajectory-metrics = "creativegainbench.eval.trajectory_eval:main"
benchmark-report = "creativegainbench.eval.report:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creativegainbench = [
    "config/*.toml",
    "artifacts/*.json",
    "artifacts/probes/*.json",
    "artifacts/codebook/*.pt",
    "artifacts/models/*.pt",
    "artifacts/models/*.pkl",
    "artifacts/manifest.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
