# CreativeGainBench defaults — aligned with math_backing Rcreativity.

[score]
alpha = 1.0
# Single-agent default; MAS rows use lambda_g_mas when lambda_g is 0.
lambda_g = 0.0
lambda_g_mas = 1.0
# Per-domain thresholds live in artifacts/delta_d_thresholds.json
# (negative-bank Q_0.95). No scalar delta_d.

[ideas]
n = 3
vocab_size = 512
span_encoder = "minilm"
span_encoder_model = "sentence-transformers/all-MiniLM-L6-v2"
embedding_dim = 384
boundary_threshold = 0.5

[count_ngram]
order = 3

# R_D backend: "count_ngram" (hard VQ, default) | "soft_count" | "kernel_parzen"
[rd]
backend = "count_ngram"
tau = 1.0

[soft_count]
order = 1
tau = 1.0

[kernel_parzen]
# Bandwidth σ calibrated on negatives only (see soft_meta / kernel_meta).
sigma = 1.0
max_bank = 4096

[receiver_expansion]
n_samples = 4
temperature = 1.0

[cue]
provider = "ollama"
model = "gemma2:2b"

[artifacts]
version = "v1"
seed = 42
